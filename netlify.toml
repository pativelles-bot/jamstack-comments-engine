# Deploy estático do repositório de protótipos (site Netlify: pativelles-lab).
#
# Publicamos a pasta ./public como está: cada projeto vive em public/<slug>/index.html
# e a raiz é apenas o índice. Definimos `base` como essa pasta para o Netlify rodar ali,
# não encontrar package.json, pular a instalação de dependências e publicar os arquivos.
#
# Leia CLAUDE.md antes de adicionar um projeto novo.
[build]
  base = "public"
  publish = "."
  command = ""
