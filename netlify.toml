# Static deploy of the Esmalteria Spindola landing page.
#
# The site is a single, self-contained index.html living in ./public.
# We set `base` to that folder so Netlify runs there: it finds no package.json,
# skips dependency installation, and simply publishes the static files.
[build]
  base = "public"
  publish = "."
  command = ""
