<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipos</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1B1D1C; --muted:#6E736F; --line:#E2E1DC; --bg:#F7F6F2; --card:#FFF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; }
  main { max-width:640px; margin:0 auto; padding:64px 24px 80px; }
  .eyebrow { font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--muted); margin:0 0 10px; }
  h1 { font-size:30px; line-height:1.15; margin:0 0 10px; font-weight:650; }
  .sub { color:var(--muted); margin:0 0 36px; max-width:52ch; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.item { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; text-decoration:none; color:inherit; transition:border-color .15s; }
  a.item:hover, a.item:focus-visible { border-color:var(--ink); outline:none; }
  .name { font-weight:650; }
  .desc { color:var(--muted); font-size:14px; margin-top:3px; }
  footer { margin-top:44px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">grupopv-dev</p>
  <h1>Protótipos</h1>
  <p class="sub">Espaço de trabalho compartilhado. Cada protótipo abaixo é um projeto
  independente, sem relação com os demais.</p>

  <ul>
    <li>
      <a class="item" href="/medida/">
        <span class="name">Medida</span>
        <span class="desc">Marcenaria sob medida na Grande Florianópolis — cliente, marcenaria e arquiteto.</span>
      </a>
    </li>
  </ul>

  <footer>Projetos em rascunho. Dados exibidos nos protótipos são fictícios.</footer>
</main>
</body>
</html>
